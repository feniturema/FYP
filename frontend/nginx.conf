# Nginx config used inside the frontend container (and as the public reverse proxy).
# Serves the built SPA and proxies /api to the backend service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assistant SSE stream: no buffering, so each token reaches the browser as it is produced.
    # Must stay before "location /api/" (docs/phases/P4b.md §7.4).
    location /api/assistant/stream {
        proxy_pass http://backend:8080/api/assistant/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Reverse proxy API calls to the Spring Boot backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy uploaded images through backend static handler
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
    }

    # Swagger UI passthrough (optional, handy for demos)
    location /swagger-ui/ { proxy_pass http://backend:8080/swagger-ui/; }
    location /v3/api-docs { proxy_pass http://backend:8080/v3/api-docs; }
}
