spring:
  application:
    name: ftsm-ecommerce
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Java 21 virtual threads for Tomcat requests, @Scheduled and @Async (VIRTUAL_THREADS=false to opt out).
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS:true}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ftsm_ecommerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

  jpa:
    hibernate:
      # Schema is owned by Flyway (db/migration); Hibernate only validates it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing Hibernate-created databases are baselined at V1 instead of re-running it.
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: false

  # SecKill order pipeline: OutboxRelay -> topic seckill.orders -> SeckillOrderListener (docs/phases/P2.md §7.1).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties: { enable.idempotence: true, max.in.flight.requests.per.connection: 5, linger.ms: 5,
                    request.timeout.ms: 5000, delivery.timeout.ms: 10000, max.block.ms: 5000 }
    consumer:
      group-id: seckill-order-writer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes-long!!}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}   # 24h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  mail:
    enabled: ${MAIL_ENABLED:false}         # when false, OTP is logged instead of emailed
    from: ${MAIL_FROM:no-reply@ftsm.ukm.edu.my}
  llm:
    # OpenAI-compatible endpoint. Default: DeepSeek. Override via env vars for other providers.
    base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-v4-flash}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-email: ${SEED_ADMIN_EMAIL:admin@ukm.edu.my}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}
  upload:
    dir: ${UPLOAD_DIR:uploads}   # relative to working dir; Docker maps this to a volume
  seckill:
    topic: seckill.orders
    dlt-topic: seckill.orders.DLT
    partitions: 6
    replicas: ${KAFKA_REPLICAS:1}
    consumer-concurrency: 3
    relay-interval-ms: 100
    relay-batch-size: 500
    event-cache-ttl: 5s
    reconcile-grace: 30m

management:
  endpoints:
    web:
      exposure:
        include: health, info
  health:
    # SMTP isn't reachable in dev (no creds) — don't let it drag /health to DOWN.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    my.edu.ukm.ftsm: INFO
