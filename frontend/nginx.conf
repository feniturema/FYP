# Nginx config used inside the frontend container (and as the public reverse proxy).
# Serves the built SPA and proxies /api to the backend service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API calls to the Spring Boot backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI passthrough (optional, handy for demos)
    location /swagger-ui/ { proxy_pass http://backend:8080/swagger-ui/; }
    location /v3/api-docs { proxy_pass http://backend:8080/v3/api-docs; }
}
