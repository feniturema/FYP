# FTSM E-Commerce — full stack for a single Linux server.
# Usage: cp .env.example .env  (edit secrets)  then  docker compose up -d --build
#
# Public site -> http://<server>/        (frontend nginx, also proxies /api)
# Backend API -> http://<server>/api/...  (proxied) or :8080 directly

services:
  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-ftsm_ecommerce}
      # Read-only account for mcp-server, created by mysql/init/01-readonly-user.sh on a NEW data volume only.
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.2
    restart: unless-stopped
    # AOF: SecKill stock / bought sets survive a restart (RDB snapshots alone can lose recent writes).
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Single-node KRaft broker for the SecKill order pipeline (topics are created by the backend).
  kafka:
    image: apache/kafka:3.9.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ["${KAFKA_HOST_PORT:-29092}:29092"]
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-ftsm_ecommerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP: kafka:9092
      SECKILL_MODE: ${SECKILL_MODE:-async}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MS: ${JWT_EXPIRY_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@ftsm.ukm.edu.my}
      # Assistant: LLM_PROVIDER defaults to none (assistant off); set deepseek plus LLM_API_KEY to enable it.
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      MCP_SERVER_URL: http://mcp-server:8081
      MCP_CLIENT_ENABLED: ${MCP_CLIENT_ENABLED:-true}
      APP_ASSISTANT_FAKEMODEL: ${APP_ASSISTANT_FAKEMODEL:-false}
      # P5a demo catalogue: only read under SPRING_PROFILES_ACTIVE containing demo.
      APP_DEMO_TARGET_DB: ${APP_DEMO_TARGET_DB:-}
      APP_DEMO_ALLOW_DEFAULT_DB: ${APP_DEMO_ALLOW_DEFAULT_DB:-false}
      APP_DEMO_ON_CONFLICT: ${APP_DEMO_ON_CONFLICT:-fail}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@ukm.edu.my}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123}
      UPLOAD_DIR: /app/uploads
      VIRTUAL_THREADS: ${VIRTUAL_THREADS:-true}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Read-only catalogue tools over MCP (streamable HTTP at /mcp) for the assistant. Starts after the backend is
  # healthy because the backend's Flyway owns the schema and mcp-server only validates it (ddl-auto: validate).
  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-ftsm_ecommerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MCP_DB_USERNAME: ftsm_ro
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD}
      REDIS_HOST: redis
    ports:
      # Local only: MCP Inspector and scripts/p4b/mcp_probe.py. Never expose it publicly.
      - "127.0.0.1:${MCP_HOST_PORT:-18082}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  uploads_data:
